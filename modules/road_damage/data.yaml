# =============================================================================
# Road Damage — dataset configuration (TEMPLATE)
# =============================================================================
# This is the template committed to the repo. The REAL file used for training
# is generated by prepare_dataset.py at <output>/data.yaml, with `path` set to
# the absolute path of the prepared dataset on the machine that built it.
#
# Build it with:
#   python -m modules.road_damage.prepare_dataset \
#       --source data/raw/rdd2022  --name rdd2022 \
#       --source data/raw/pothole  --name pothole_roboflow \
#       --respect-split pothole_roboflow \
#       --output data/road_damage_prepared
#
# The `names` order below IS the model's class-id order and must stay in sync
# with modules/road_damage/class_mapping.py:PROJECT_CLASSES. Changing it
# invalidates any trained weights.
# =============================================================================

path: ../data/road_damage_prepared
train: images/train
val: images/val

# Ultralytics calls this key `test`. It points at an INTERNAL held-out split
# created by prepare_dataset.py before training — it is NOT the official
# RDD2022 challenge test set, and must never be described as one.
test: images/internal_test

nc: 4
names:
  - pothole             # RDD2022 D40  + supplementary pothole dataset
  - longitudinal_crack  # RDD2022 D00
  - transverse_crack    # RDD2022 D10
  - alligator_crack     # RDD2022 D20
